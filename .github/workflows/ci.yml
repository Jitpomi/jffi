name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2021 --check cli/src/web_bindings/schema.rs cli/src/web_bindings/abi_runtime.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo package -p jffi --locked

  generated-project:
    name: Generated project smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install --path cli --root "$RUNNER_TEMP/jffi-install" --locked
      - name: Generate from embedded templates and check the project
        run: |
          JFFI_FORCE_EMBEDDED_TEMPLATES=1 "$RUNNER_TEMP/jffi-install/bin/jffi" new smoke-app --platforms web --path "$RUNNER_TEMP/jffi-smoke" --no-build
          cd "$RUNNER_TEMP/jffi-smoke"
          cargo generate-lockfile
          cargo check --workspace --locked
          "$RUNNER_TEMP/jffi-install/bin/jffi" setup --platform web
          "$RUNNER_TEMP/jffi-install/bin/jffi" build --platform web
          cd platforms/web
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

  cross-platform-compile:
    name: Compile CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked
      - name: Exercise embedded scaffolding
        shell: bash
        run: |
          cargo build -p jffi --locked
          JFFI_FORCE_EMBEDDED_TEMPLATES=1 target/debug/jffi new smoke-app --platforms web --path "$RUNNER_TEMP/jffi-smoke" --no-build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  native-generated-app:
    name: Native generated app (${{ matrix.platform }}, ${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos, platforms: 'macos,windows' }
          - { os: xcode-27, platform: macos, platforms: 'macos,windows' }
          - { os: macos-latest, platform: ios, platforms: ios }
          - { os: ubuntu-latest, platform: android, platforms: android }
          - { os: windows-latest, platform: windows, platforms: windows }
          - { os: ubuntu-latest, platform: linux, platforms: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select stable Xcode 27
        if: matrix.os == 'xcode-27'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build CLI and generate native project
        shell: bash
        env:
          NATIVE_PLATFORMS: ${{ matrix.platforms }}
        run: |
          cargo build --locked
          target/debug/jffi new native-smoke --template hello --platforms "$NATIVE_PLATFORMS" --path "$RUNNER_TEMP/native-smoke" --no-build
      - name: Configure non-placeholder package identifiers
        shell: python
        run: |
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'native-smoke' / 'jffi.toml'
          s = p.read_text().replace('com.example.', 'com.jitpomi.ci.')
          s = s.replace('version = "0.1.0"', 'version = "0.1.0"\nrelease_date = "2026-10-24"', 1)
          s += '\n[bundle]\nidentifier = "com.jitpomi.ci.nativesmoke"\n'
          s += '\n[bundle.windows]\nformats = ["msix"]\ntargets = ["x86_64-pc-windows-msvc"]\nidentity_name = "Jitpomi.NativeSmoke"\npublisher_id = "CN=JitpomiCI"\n'
          p.write_text(s)
      - name: Verify mounted DMG layout on macOS 27
        if: matrix.os == 'xcode-27'
        run: cargo test -p jffi macos_dmg --locked
      - name: Prepare Android SDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare and build native bindings/application
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          cd "$RUNNER_TEMP/native-smoke"
          cargo generate-lockfile
          jffi setup --platform "$NATIVE_PLATFORM"
          if [ "$NATIVE_PLATFORM" = windows ]; then
            jffi doctor bundle --platform windows
          fi
          jffi build --platform "$NATIVE_PLATFORM" --release
      - name: Compile Apple UI
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          cd "$RUNNER_TEMP/native-smoke"
          if [ "$NATIVE_PLATFORM" = ios ]; then
            destination='generic/platform=iOS Simulator'
          else
            destination='generic/platform=macOS'
          fi
          xcodebuild -project "platforms/$NATIVE_PLATFORM/NativeSmoke.xcodeproj" -scheme NativeSmoke -configuration Release -destination "$destination" -derivedDataPath target/native-ci CODE_SIGNING_ALLOWED=NO build
      - name: Compile Android UI and APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/native-smoke/platforms/android"
          "$JAVA_HOME/bin/java" -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Build unsigned native package
        if: matrix.platform != 'android'
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          cd "$RUNNER_TEMP/native-smoke"
          case "$NATIVE_PLATFORM" in
            ios) jffi bundle --platform ios --format xcarchive --no-sign ;;
            macos)
              if [ "${{ matrix.os }}" = xcode-27 ]; then
                jffi bundle --platform macos --format dmg --no-sign
              else
                jffi bundle --platform macos --format app --no-sign
              fi ;;
            *) jffi bundle --platform "$NATIVE_PLATFORM" --no-sign ;;
          esac

  web-uniffi-compatibility:
    name: Web/native UniFFI compatibility (${{ matrix.uniffi }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        uniffi: ['0.29.4', '0.31.1']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install compatibility test tools
        env:
          UNIFFI_VERSION: ${{ matrix.uniffi }}
        run: |
          cargo install wasm-pack --version 0.13.1 --locked
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          mkdir -p "$RUNNER_TEMP/uniffi-driver/src"
          cat > "$RUNNER_TEMP/uniffi-driver/Cargo.toml" <<EOF
          [package]
          name = "uniffi-bindgen"
          version = "$UNIFFI_VERSION"
          edition = "2021"
          [workspace]
          [dependencies]
          uniffi = { version = "=$UNIFFI_VERSION", features = ["cli"] }
          EOF
          echo 'fn main() { uniffi::uniffi_bindgen_main(); }' > "$RUNNER_TEMP/uniffi-driver/src/main.rs"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/uniffi-driver/Cargo.toml"
          cargo install --path "$RUNNER_TEMP/uniffi-driver" --locked
          npm install --prefix "$RUNNER_TEMP/typescript" --ignore-scripts typescript@7.0.2
      - name: Compare real WASM with generated native bindings
        env:
          JFFI_COMPAT_UNIFFI_VERSION: ${{ matrix.uniffi }}
        run: |
          mkdir -p "$RUNNER_TEMP/web-compat-target"
          export JFFI_WASM_TEST_TARGET_DIR="$RUNNER_TEMP/web-compat-target"
          export JFFI_TYPESCRIPT_TSC="$RUNNER_TEMP/typescript/node_modules/typescript/lib/tsc.js"
          cargo test -p jffi --test web_bindings_wasm --locked -- --ignored --nocapture
