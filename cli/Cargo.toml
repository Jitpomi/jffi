[package]
name = "jffi"
version = "0.4.7"
edition = "2021"
authors = ["JFFI Contributors"]
description = "Cross-platform framework for building native apps with Rust business logic and platform-native UIs"
license = "GPL-3.0"
repository = "https://github.com/Jitpomi/jffi"
homepage = "https://github.com/Jitpomi/jffi"
documentation = "https://github.com/Jitpomi/jffi#readme"
keywords = ["cross-platform", "mobile", "desktop", "uniffi", "native"]
categories = ["command-line-utilities", "development-tools", "gui"]
readme = "../README.md"

[[bin]]
name = "jffi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0.95"
toml = "0.8.19"
serde = { version = "1.0.228", features = ["derive"] }
colored = "3.1"
indicatif = "0.18"
notify = "8.2"
crossbeam-channel = "0.5"
dialoguer = "0.12"
rand = "0.10"
uuid = { version = "1.23", features = ["v4"] }
syn = { version = "2.0.96", features = ["full", "parsing", "visit"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
include_dir = "0.7"
serde_json = "1.0.149"
shell-words = "1.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
