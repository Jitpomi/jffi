[package]
name = "jffi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jffi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
notify = "6.1"
crossbeam-channel = "0.5"
