[package]
name = "jffi"
version = "0.1.4"
edition = "2021"
authors = ["JFFI Contributors"]
description = "Cross-platform framework for building native apps with Rust business logic and platform-native UIs"
license = "MIT"
repository = "https://github.com/Jitpomi/jffi"
homepage = "https://github.com/Jitpomi/jffi"
documentation = "https://github.com/Jitpomi/jffi#readme"
keywords = ["cross-platform", "mobile", "desktop", "uniffi", "native"]
categories = ["command-line-utilities", "development-tools", "gui"]
readme = "../README.md"

[[bin]]
name = "jffi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
notify = "6.1"
crossbeam-channel = "0.5"
