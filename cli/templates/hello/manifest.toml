[template]
name = "HelloWorld"
description = "Simple hello world greeting app"
author = "JFFI Team"
version = "1.0.0"

[variables]
greeting = "Hello from JFFI"

# Windows-specific variables (overrides defaults)
[variables.windows]
# Windows requires UniFFI 0.29.4 to match uniffi-bindgen-cs v0.10.0+v0.29.4
# Other platforms use default (0.31.1 from templating.rs)
uniffi_version = "0.29.4"

[platforms]
supported = ["ios", "macos", "android", "windows", "linux", "web"]
